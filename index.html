<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Jardín Kwai</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:pointer}
</style>
</head>
<body>
<canvas id="garden"></canvas>
<script>
const C=document.getElementById('garden'),X=C.getContext('2d');
let W,H,DPR,globalTime=0;

function resize(){
  DPR=devicePixelRatio||1;W=innerWidth;H=innerHeight;
  C.width=W*DPR;C.height=H*DPR;
  C.style.width=W+'px';C.style.height=H+'px';
  X.setTransform(DPR,0,0,DPR,0,0);
  grassCache=null;vineCache=null;
}
addEventListener('resize',resize);

function rng(a){return()=>{let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function lerp(a,b,t){return a+(b-a)*t}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

function pencilStroke(drawFn,o={}){
  const{strokes=3,off=1.2,color='#3a5a2a',lw=1.2,seed=0}=o;
  const r=rng(seed);
  X.save();X.strokeStyle=color;X.lineCap='round';X.lineJoin='round';
  for(let i=0;i<strokes;i++){
    X.save();
    X.lineWidth=lw+(r()-.5)*.5;
    X.globalAlpha=.3+r()*.3;
    X.translate((r()-.5)*off,(r()-.5)*off);
    drawFn(X,r,i);X.stroke();X.restore();
  }
  X.restore();
}

function pencilFill(drawFn,o={}){
  const{color='#5a8a4a',alpha=.5,seed=0}=o;
  const r=rng(seed);
  X.save();X.fillStyle=color;X.globalAlpha=alpha;
  for(let i=0;i<2;i++){
    X.save();X.translate((r()-.5)*.6,(r()-.5)*.6);
    X.beginPath();drawFn(X,r,i);X.fill();X.restore();
  }
  X.restore();
}

let grassCache=null;
function buildGrassCache(){
  grassCache=document.createElement('canvas');
  grassCache.width=W*DPR;grassCache.height=H*DPR;
  const g=grassCache.getContext('2d');
  g.setTransform(DPR,0,0,DPR,0,0);
  const r=rng(77777);

  for(let i=0;i<800;i++){
    const x=r()*W,y=r()*H,sz=1+r()*4;
    g.fillStyle=`rgba(${150+Math.floor(r()*40)},${200+Math.floor(r()*30)},${130+Math.floor(r()*30)},${.02+r()*.04})`;
    g.beginPath();g.arc(x,y,sz,0,Math.PI*2);g.fill();
  }

  for(let i=0;i<40;i++){
    const x=r()*W,y=r()*H;
    g.fillStyle=`rgba(${140+Math.floor(r()*30)},${200+Math.floor(r()*25)},${120+Math.floor(r()*25)},${.05+r()*.06})`;
    g.beginPath();g.ellipse(x,y,r()*20+8,r()*10+3,r()*.5,0,Math.PI*2);g.fill();
  }

  for(let layer=0;layer<7;layer++){
    const cnt=350+layer*90;
    const bH=1.5+layer*2.5;
    const mH=bH+5+layer*4;
    const a0=.12+layer*.06;
    const rP=165-layer*6+Math.floor(r()*15);
    const gP=218-layer*5+Math.floor(r()*15);
    const bP=148-layer*3+Math.floor(r()*12);
    for(let i=0;i<cnt;i++){
      const x=r()*W,y=r()*H;
      const h=bH+r()*(mH-bH);
      const w=.2+r()*.4;
      const cr=rP+Math.floor(r()*12),cg=gP+Math.floor(r()*12),cb=bP+Math.floor(r()*10);
      g.strokeStyle=`rgba(${cr},${cg},${cb},${a0+r()*.1})`;
      g.lineWidth=w;g.lineCap='round';
      const cu=(r()-.5)*7;
      g.beginPath();g.moveTo(x,y);
      g.quadraticCurveTo(x+cu,y-h*.55,x+cu*1.3,y-h);g.stroke();
    }
  }

  for(let i=0;i<25;i++){
    const x=r()*W,y=r()*H,sz=1.5+r()*2;
    for(let j=0;j<4;j++){
      const a=(j/4)*Math.PI*2;
      g.fillStyle=`rgba(${200+Math.floor(r()*50)},${220+Math.floor(r()*30)},${180+Math.floor(r()*35)},${.25+r()*.25})`;
      g.beginPath();g.arc(x+Math.cos(a)*sz,y+Math.sin(a)*sz,sz*.5,0,Math.PI*2);g.fill();
    }
    g.fillStyle='rgba(220,200,120,.35)';
    g.beginPath();g.arc(x,y,sz*.4,0,Math.PI*2);g.fill();
  }

  for(let i=0;i<70;i++){
    const x=r()*W,y=r()*H;
    g.fillStyle=`rgba(${200+Math.floor(r()*50)},${225+Math.floor(r()*30)},${160+Math.floor(r()*30)},${.08+r()*.12})`;
    g.beginPath();g.arc(x,y,.4+r()*1,0,Math.PI*2);g.fill();
  }
}

function drawGardenBackground(){
  if(!grassCache)buildGrassCache();
  const grad=X.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#d8eac4');grad.addColorStop(.2,'#cce0b8');
  grad.addColorStop(.5,'#c0d8a8');grad.addColorStop(.8,'#b4d098');
  grad.addColorStop(1,'#a8c888');
  X.fillStyle=grad;X.fillRect(0,0,W,H);
  X.drawImage(grassCache,0,0,W,H);
  const sunGrad=X.createRadialGradient(W*.15,H*.08,0,W*.15,H*.08,W*.6);
  sunGrad.addColorStop(0,'rgba(255,255,240,.12)');sunGrad.addColorStop(1,'rgba(255,255,240,0)');
  X.fillStyle=sunGrad;X.fillRect(0,0,W,H);
}

let vineCache=null;
function buildVineCache(){
  vineCache=document.createElement('canvas');
  vineCache.width=W*DPR;vineCache.height=H*DPR;
  const v=vineCache.getContext('2d');
  v.setTransform(DPR,0,0,DPR,0,0);
  const r=rng(31415);
  function drawLeaf(cx,cy,sz,angle){
    v.save();v.translate(cx,cy);v.rotate(angle);
    v.beginPath();
    v.moveTo(0,0);
    v.bezierCurveTo(sz*.15,-sz*.5,sz*.5,-sz*.75,sz*.12,-sz*1.05);
    v.bezierCurveTo(sz*.04,-sz*.85,0,-sz*.6,0,-sz*.4);
    v.bezierCurveTo(0,-sz*.6,-sz*.04,-sz*.85,-sz*.12,-sz*1.05);
    v.bezierCurveTo(-sz*.5,-sz*.75,-sz*.15,-sz*.5,0,0);
    const lg=v.createRadialGradient(0,-sz*.5,0,0,-sz*.5,sz);
    lg.addColorStop(0,'#4a8a38');lg.addColorStop(.6,'#3a7a28');lg.addColorStop(1,'#2a6a18');
    v.fillStyle=lg;v.globalAlpha=.9;v.fill();
    v.strokeStyle='#1a5a0a';v.lineWidth=.5;v.globalAlpha=.3;v.stroke();
    v.restore();
  }
  function drawVineStrand(x1,y1,x2,y2,cp1x,cp1y,cp2x,cp2y,leafCount){
    v.save();
    v.strokeStyle='#2a6018';v.lineWidth=4;v.globalAlpha=.5;v.lineCap='round';
    v.beginPath();v.moveTo(x1,y1);v.bezierCurveTo(cp1x,cp1y,cp2x,cp2y,x2,y2);v.stroke();
    v.strokeStyle='#3a7020';v.lineWidth=2;v.globalAlpha=.4;
    v.beginPath();v.moveTo(x1+1,y1+1);v.bezierCurveTo(cp1x+1,cp1y+1,cp2x+1,cp2y+1,x2+1,y2+1);v.stroke();
    for(let i=0;i<leafCount;i++){
      const t=i/leafCount;
      const lx=cp1x+t*(cp2x-cp1x),ly=cp1y+t*(cp2y-cp1y);
      const leafSz=6+r()*12;
      const a=Math.atan2(cp2y-cp1y,cp2x-cp1x)+(r()-.5)*1.2+1.2;
      drawLeaf(lx,ly,leafSz,a);
    }
    v.restore();
  }
  const m=25,off=W*.12;
  drawVineStrand(0,0,W*.15,H*.12,W*.05,H*.01,W*.1,H*.06,Math.floor(W/50));
  drawVineStrand(W*.05,H*.02,W*.3,H*.08,W*.12,H*.06,W*.2,H*.04,Math.floor(W/60));
  drawVineStrand(W,0,W*.85,H*.12,W*.95,H*.01,W*.9,H*.06,Math.floor(W/50));
  drawVineStrand(W*.95,H*.02,W*.7,H*.08,W*.88,H*.06,W*.8,H*.04,Math.floor(W/60));
  drawVineStrand(0,H,W*.15,H*.88,W*.05,H*.99,W*.1,H*.94,Math.floor(W/50));
  drawVineStrand(W*.05,H*.98,W*.3,H*.92,W*.12,H*.94,W*.2,H*.96,Math.floor(W/60));
  drawVineStrand(W,H,W*.85,H*.88,W*.95,H*.99,W*.9,H*.94,Math.floor(W/50));
  drawVineStrand(W*.95,H*.98,W*.7,H*.92,W*.88,H*.94,W*.8,H*.96,Math.floor(W/60));
  drawVineStrand(0,0,W*.08,H*.2,0,H*.05,W*.03,H*.1,Math.floor(H/55));
  drawVineStrand(W,0,W*.92,H*.2,W,H*.05,W*.97,H*.1,Math.floor(H/55));
  drawVineStrand(0,H,W*.08,H*.8,0,H*.95,W*.03,H*.9,Math.floor(H/55));
  drawVineStrand(W,H,W*.92,H*.8,W,H*.95,W*.97,H*.9,Math.floor(H/55));
  for(let i=0;i<80;i++){
    const cx=Math.random()<.5?r()*W*.18:W-r()*W*.18;
    const cy=Math.random()<.5?r()*H*.18:H-r()*H*.18;
    const xOff=(r()-.5)*15,yOff=(r()-.5)*15;
    drawLeaf(cx+xOff,cy+yOff,8+r()*14,r()*Math.PI*2);
  }
}

let vineAnimData=[];
function initVineAnim(){
  vineAnimData=[];
  const sides=[
    {sx:0,sy:0,ex:.18,ey:.15,dir:1},
    {sx:.18,sy:.02,ex:.35,ey:.12,dir:1},
    {sx:1,sy:0,ex:.82,ey:.15,dir:-1},
    {sx:.82,sy:.02,ex:.65,ey:.12,dir:-1},
    {sx:0,sy:1,ex:.18,ey:.85,dir:1},
    {sx:.18,sy:.98,ex:.35,ey:.88,dir:1},
    {sx:1,sy:1,ex:.82,ey:.85,dir:-1},
    {sx:.82,sy:.98,ex:.65,ey:.88,dir:-1},
    {sx:0,sy:0,ex:.08,ey:.25,dir:1},
    {sx:1,sy:0,ex:.92,ey:.25,dir:-1},
    {sx:0,sy:1,ex:.08,ey:.75,dir:1},
    {sx:1,sy:1,ex:.92,ey:.75,dir:-1},
  ];
  for(const s of sides){
    vineAnimData.push({
      sx:s.sx,sy:s.sy,ex:s.ex,ey:s.ey,dir:s.dir,
      phase:Math.random()*Math.PI*2,
      amp:.04+Math.random()*.06
    });
  }
}

function drawAnimatedVines(time){
  if(!vineCache)buildVineCache();
  X.drawImage(vineCache,0,0,W,H);
  X.save();
  for(const v of vineAnimData){
    const sx=v.sx*W,sy=v.sy*H,ex=v.ex*W,ey=v.ey*H;
    const sway=Math.sin(time*.4+v.phase)*v.amp;
    const sway2=Math.cos(time*.3+v.phase*1.3)*v.amp*.6;
    const cpx1=sx+(ex-sx)*.3+sway*W,cp1y=sy+(ey-sy)*.25+sway2*H;
    const cpx2=sx+(ex-sx)*.7+sway2*W,cp2y=sy+(ey-sy)*.65+sway*H;
    X.strokeStyle='#1a5a0a';X.lineWidth=5;X.globalAlpha=.4;X.lineCap='round';
    X.beginPath();X.moveTo(sx,sy);X.bezierCurveTo(cpx1,cp1y,cpx2,cp2y,ex,ey);X.stroke();
    X.strokeStyle='#2a6a15';X.lineWidth=2.5;X.globalAlpha=.35;
    X.beginPath();X.moveTo(sx+1,sy+1);X.bezierCurveTo(cpx1+1,cp1y+1,cpx2+1,cp2y+1,ex+1,ey+1);X.stroke();
    const numLeaves=8+Math.floor(W/120);
    for(let i=0;i<numLeaves;i++){
      const t=i/numLeaves;
      const lx=cpx1+t*(cpx2-cpx1),ly=cp1y+t*(cp2y-cp1y);
      const lsz=6+Math.sin(time*.6+v.phase+i*.7)*3;
      const la=Math.atan2(cp2y-cp1y,cpx2-cpx1)+(Math.sin(time*.5+v.phase+i)*.25)+(i%2?1.2:-.8);
      X.save();X.translate(lx,ly);X.rotate(la);
      X.fillStyle='#3a7a28';X.globalAlpha=.65;
      X.beginPath();X.moveTo(0,0);
      X.bezierCurveTo(lsz*.15,-lsz*.5,lsz*.5,-lsz*.7,lsz*.12,-lsz);
      X.bezierCurveTo(lsz*.04,-lsz*.8,0,-lsz*.55,0,-lsz*.35);
      X.bezierCurveTo(0,-lsz*.55,-lsz*.04,-lsz*.8,-lsz*.12,-lsz);
      X.bezierCurveTo(-lsz*.5,-lsz*.7,-lsz*.15,-lsz*.5,0,0);
      X.fill();X.restore();
    }
  }
  X.restore();
}

function drawVignette(){
  const g=X.createRadialGradient(W*.5,H*.5,W*.25,W*.5,H*.5,W*.85);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(20,40,10,.25)');
  X.fillStyle=g;X.fillRect(0,0,W,H);
}

let nid=0;
function createFlowerFns(){
function gerbera(ctx,sz,r){
  const n=24+Math.floor(r()*6);
  const pl=.85+r()*.1;
  const pw=.2+r()*.04;
  const cols=['#ff7f50','#ff6b35','#ff8c69','#ff6347'];
  const c=cols[Math.floor(r()*cols.length)];
  ctx.save();ctx.scale(sz,sz);
  for(let i=0;i<n;i++){
    const a=(i/n)*Math.PI*2;
    ctx.save();ctx.rotate(a);
    ctx.beginPath();ctx.moveTo(0,0);
    ctx.quadraticCurveTo(pl*.4,-pw,pl,0);
    ctx.quadraticCurveTo(pl*.4,pw,0,0);
    ctx.closePath();
    ctx.fillStyle=c;ctx.fill();
    ctx.strokeStyle='rgba(60,30,20,.25)';ctx.lineWidth=.04;ctx.stroke();
    ctx.restore();
  }
  for(let i=0;i<n;i++){
    const a=(i/n)*Math.PI*2+Math.PI/n;
    ctx.save();ctx.rotate(a);
    ctx.beginPath();ctx.moveTo(0,0);
    ctx.quadraticCurveTo(pl*.35,-pw*.6,pl*.75,0);
    ctx.quadraticCurveTo(pl*.35,pw*.6,0,0);
    ctx.closePath();
    ctx.fillStyle='rgba(255,255,255,.15)';ctx.fill();
    ctx.strokeStyle='rgba(60,30,20,.12)';ctx.lineWidth=.03;ctx.stroke();
    ctx.restore();
  }
  ctx.beginPath();ctx.arc(0,0,.15,0,Math.PI*2);
  const g=ctx.createRadialGradient(0,0,0,0,0,.15);
  g.addColorStop(0,'#f0d860');g.addColorStop(.5,'#b08030');g.addColorStop(1,'#5a3a1a');
  ctx.fillStyle=g;ctx.fill();
  for(let i=0;i<12;i++){
    const a=r()*Math.PI*2,d=r()*.1;
    ctx.beginPath();ctx.arc(Math.cos(a)*d,Math.sin(a)*d,.02+r()*.01,0,Math.PI*2);
    ctx.fillStyle='#f0d050';ctx.fill();
  }
  ctx.restore();
}

function lily(ctx,sz,r){
  ctx.save();ctx.scale(sz,sz);
  const cols=['#faf5ee','#f5eee5','#fee9d6'];
  const bc=cols[Math.floor(r()*cols.length)];
  const pl=.95,pw=.28;
  for(let layer=0;layer<2;layer++){
    const off=layer*Math.PI/6;
    for(let i=0;i<3;i++){
      const a=off+(i/3)*Math.PI*2;
      ctx.save();ctx.rotate(a);
      ctx.beginPath();ctx.moveTo(0,0);
      ctx.quadraticCurveTo(pl*.35,-pw,pl*.8,-pw*.3);
      ctx.quadraticCurveTo(pl,0,pl*.8,pw*.3);
      ctx.quadraticCurveTo(pl*.35,pw,0,0);
      ctx.closePath();
      ctx.fillStyle=bc;ctx.fill();
      ctx.strokeStyle='rgba(80,60,40,.25)';ctx.lineWidth=.05;ctx.stroke();
      ctx.restore();
    }
  }
  for(let i=0;i<6;i++){
    const a=(i/6)*Math.PI*2+r()*.08;
    ctx.save();ctx.rotate(a);
    ctx.strokeStyle='#c89060';ctx.lineWidth=.35;ctx.globalAlpha=.6;
    ctx.beginPath();ctx.moveTo(.1,0);
    ctx.quadraticCurveTo(.4,-.1,.55,.15);
    ctx.stroke();
    ctx.fillStyle='#d8a030';ctx.beginPath();ctx.arc(.55,.15,.045,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
  for(let i=0;i<6;i++){
    const a=(i/6)*Math.PI*2;
    ctx.save();ctx.rotate(a);
    ctx.strokeStyle='rgba(160,120,70,.15)';ctx.lineWidth=.25;
    ctx.beginPath();ctx.moveTo(.1,0);ctx.lineTo(.6,0);ctx.stroke();
    ctx.restore();
  }
  ctx.beginPath();ctx.arc(0,0,.08,0,Math.PI*2);
  ctx.fillStyle='#b09060';ctx.fill();
  ctx.restore();
}

function lilyValley(ctx,sz,r){
  ctx.save();ctx.scale(sz,sz);
  const stemH=1.1+r()*.2;
  const bend=.4+r()*.25;
  const dir=r()>.5?1:-1;
  ctx.strokeStyle='#4a8030';ctx.lineWidth=.04;ctx.globalAlpha=.55;
  ctx.lineCap='round';
  const ex=dir*bend*1.5,ey=.05-stemH;
  ctx.beginPath();ctx.moveTo(0,.05);
  ctx.bezierCurveTo(dir*bend*.15,.05-stemH*.1,dir*bend*.85,.05-stemH*.35,ex,ey);
  ctx.stroke();
  ctx.strokeStyle='#3a7020';ctx.lineWidth=.018;ctx.globalAlpha=.25;
  ctx.beginPath();ctx.moveTo(dir*.3,.05);
  ctx.bezierCurveTo(dir*bend*.15+.3,.05-stemH*.1,dir*bend*.85+.3,.05-stemH*.35,ex+dir*.3,ey);
  ctx.stroke();
  const bells=5+Math.floor(r()*5);
  for(let i=0;i<bells;i++){
    const t=.08+(i/(bells-1))*.85;
    const bx=dir*bend*1.5*t,by=(.05-stemH*t)+(1-t)*.08;
    const bs=.22+r()*.08;
    const hangAngle=.15-.25*t+dir*.35;
    ctx.save();ctx.translate(bx,by);ctx.rotate(hangAngle);
    ctx.beginPath();ctx.moveTo(0,0);
    ctx.quadraticCurveTo(bs*.4,bs*.05,bs*.4,-bs*.25);
    ctx.quadraticCurveTo(bs*.2,-bs*.5,0,-bs*.55);
    ctx.quadraticCurveTo(-bs*.2,-bs*.5,-bs*.4,-bs*.25);
    ctx.quadraticCurveTo(-bs*.4,bs*.05,0,0);
    ctx.closePath();
    ctx.fillStyle='#f8f8f5';ctx.fill();
    ctx.strokeStyle='rgba(100,120,90,.25)';ctx.lineWidth=.02;ctx.stroke();
    ctx.beginPath();ctx.arc(0,-bs*.18,bs*.12,0,Math.PI*2);
    ctx.fillStyle='rgba(170,200,150,.45)';ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

function carnation(ctx,sz,r){
  ctx.save();ctx.scale(sz,sz);
  const cols=['#f096a8','#e888a0','#f0b0c0','#e898a8'];
  const bc=cols[Math.floor(r()*cols.length)];
  for(let l=0;l<5;l++){
    const ls=.15+(l/5)*.85,cnt=8+l*4;
    for(let i=0;i<cnt;i++){
      const a=(i/cnt)*Math.PI*2+r()*.3;
      const pl=ls*(.5+r()*.5);
      ctx.save();ctx.rotate(a);
      ctx.beginPath();ctx.moveTo(0,0);
      const steps=9;
      for(let s=1;s<=steps;s++){
        const t=s/steps,x=t*pl;
        const y=Math.sin(t*6*Math.PI)*.06*(1-t*.4)+(r()-.5)*.02;
        ctx.lineTo(x,y);
      }
      for(let s=steps;s>=0;s--){
        const t=s/steps,x=t*pl;
        const y=-Math.sin(t*6*Math.PI)*.06*(1-t*.4)+(r()-.5)*.02;
        ctx.lineTo(x,y);
      }
      ctx.closePath();
      ctx.fillStyle=bc;ctx.globalAlpha=.25+l*.12;ctx.fill();
      ctx.strokeStyle='rgba(120,60,70,.2)';ctx.lineWidth=.03;ctx.stroke();
      ctx.restore();
    }
  }
  ctx.beginPath();ctx.arc(0,0,.08,0,Math.PI*2);
  ctx.fillStyle='#6a4a50';ctx.globalAlpha=.5;ctx.fill();
  ctx.restore();
}

function chrysanthemum(ctx,sz,r){
  ctx.save();ctx.scale(sz,sz);
  const cols=['#f0c840','#f0b030','#e8a838','#f8d050'];
  const bc=cols[Math.floor(r()*cols.length)];
  for(let layer=0;layer<4;layer++){
    const ls=.2+layer*.22,cnt=35-layer*4;
    for(let i=0;i<cnt;i++){
      const a=(i/cnt)*Math.PI*2+r()*.12;
      const pl=ls*(.7+r()*.3);
      ctx.save();ctx.rotate(a);
      ctx.beginPath();ctx.moveTo(0,0);
      ctx.quadraticCurveTo(pl*.35,-.04,pl*.75,-.035);
      ctx.quadraticCurveTo(pl,-.015,pl,.005);
      ctx.quadraticCurveTo(pl*.75,.025,pl*.35,.04);
      ctx.closePath();
      ctx.fillStyle=bc;ctx.globalAlpha=.2+layer*.14;ctx.fill();
      ctx.restore();
    }
  }
  ctx.beginPath();ctx.arc(0,0,.08,0,Math.PI*2);
  ctx.fillStyle='#6a5010';ctx.globalAlpha=.7;ctx.fill();
  ctx.restore();
}

function tulip(ctx,sz,r){
  ctx.save();ctx.scale(sz,sz);
  const cols=[['#e05060','#f09090'],['#f06850','#f89870'],['#d06080','#e898a8'],['#f0a050','#f8c870']];
  const c=cols[Math.floor(r()*cols.length)];
  const ch=.75;
  for(let i=0;i<3;i++){
    const a=(i/3)*Math.PI*2+.2;
    ctx.save();ctx.rotate(a);
    ctx.beginPath();ctx.moveTo(0,-.05);
    ctx.quadraticCurveTo(.28,-ch*.35,.22,-ch);
    ctx.quadraticCurveTo(.12,-ch*1.05,0,-ch*.95);
    ctx.quadraticCurveTo(-.12,-ch*1.05,-.22,-ch);
    ctx.quadraticCurveTo(-.28,-ch*.35,0,-.05);
    ctx.closePath();
    const g=ctx.createLinearGradient(0,0,0,-ch);
    g.addColorStop(0,c[0]);g.addColorStop(.6,c[0]);g.addColorStop(1,'rgba(80,30,40,.3)');
    ctx.fillStyle=g;ctx.globalAlpha=.75;ctx.fill();
    ctx.strokeStyle='rgba(80,40,50,.35)';ctx.lineWidth=.06;ctx.stroke();
    ctx.restore();
  }
  for(let i=0;i<3;i++){
    const a=(i/3)*Math.PI*2+.35;
    ctx.save();ctx.rotate(a);
    ctx.beginPath();ctx.moveTo(.03,-.05);
    ctx.quadraticCurveTo(.14,-ch*.4,.08,-ch*.85);
    ctx.quadraticCurveTo(.04,-ch*.9,0,-ch*.85);
    ctx.quadraticCurveTo(-.02,-ch*.8,.01,-.05);
    ctx.closePath();
    ctx.fillStyle=c[1];ctx.globalAlpha=.35;ctx.fill();
    ctx.restore();
  }
  ctx.beginPath();ctx.arc(0,-ch*.9,.06,0,Math.PI*2);
  ctx.fillStyle='#f0e060';ctx.globalAlpha=.8;ctx.fill();
  for(let i=0;i<5;i++){
    const a=(i/5)*Math.PI*2+r()*.15;
    ctx.save();ctx.rotate(a);
    ctx.strokeStyle='#f0e060';ctx.lineWidth=.25;ctx.globalAlpha=.5;
    ctx.beginPath();ctx.moveTo(.06,-ch*.87);
    ctx.quadraticCurveTo(.2+r()*.1,-ch*.8-.05,.22+r()*.08,-ch*.75);ctx.stroke();
    ctx.beginPath();ctx.arc(.22+r()*.08,-ch*.75,.025,0,Math.PI*2);
    ctx.fillStyle='#d8a030';ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

function orchid(ctx,sz,r){
  ctx.save();ctx.scale(sz,sz);
  const cols=[['#d0a8d8','#e8c0e8'],['#c898d0','#e0b0e0'],['#e0b0c8','#f0d0d8']];
  const c=cols[Math.floor(r()*cols.length)];
  const pl=.7,pw=.18;
  for(let i=0;i<3;i++){
    const a=(i/3)*Math.PI*2;
    ctx.save();ctx.rotate(a);
    ctx.beginPath();ctx.moveTo(0,0);
    ctx.quadraticCurveTo(pl*.35,-pw*.8,pl*1.05,-.02);
    ctx.quadraticCurveTo(pl*.35,pw*.8,0,0);
    ctx.closePath();ctx.fillStyle=c[0];ctx.globalAlpha=.7;ctx.fill();
    ctx.strokeStyle='rgba(100,60,80,.2)';ctx.lineWidth=.04;ctx.stroke();
    ctx.restore();
  }
  for(let i=0;i<2;i++){
    const a=(i/2)*Math.PI*2+Math.PI/3;
    ctx.save();ctx.rotate(a);
    ctx.beginPath();ctx.moveTo(0,0);
    ctx.quadraticCurveTo(pl*.35,-pw*1.1,pl*1.05,-.02);
    ctx.quadraticCurveTo(pl*.35,pw*1.1,0,0);
    ctx.closePath();ctx.fillStyle=c[1];ctx.globalAlpha=.8;ctx.fill();
    ctx.strokeStyle='rgba(100,60,80,.2)';ctx.lineWidth=.04;ctx.stroke();
    ctx.restore();
  }
  ctx.save();ctx.rotate(Math.PI/3);
  ctx.beginPath();ctx.moveTo(0,0);
  ctx.quadraticCurveTo(.35,-.28,.48,-.08);
  ctx.quadraticCurveTo(.4,.12,.2,.25);
  ctx.quadraticCurveTo(.08,.2,0,.08);
  ctx.closePath();
  ctx.fillStyle='#f0d0e8';ctx.globalAlpha=.9;ctx.fill();
  ctx.strokeStyle='rgba(120,80,100,.25)';ctx.lineWidth=.05;ctx.stroke();
  ctx.restore();
  ctx.beginPath();ctx.arc(.04,-.02,.055,0,Math.PI*2);
  ctx.fillStyle='#f0e060';ctx.globalAlpha=.8;ctx.fill();
  for(let i=0;i<4;i++){
    const a=(i/4)*Math.PI*2+r()*.15;
    ctx.save();ctx.rotate(a);
    ctx.strokeStyle='rgba(160,100,130,.25)';ctx.lineWidth=.2;
    ctx.beginPath();ctx.moveTo(.05,0);ctx.quadraticCurveTo(.3,.05,.4,-.05);ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

function lotus(ctx,sz,r){
  ctx.save();ctx.scale(sz,sz);
  const cols=['#f0c8d8','#e8b8d0','#f5d8e0','#f0d0e0'];
  const bc=cols[Math.floor(r()*cols.length)];
  for(let layer=0;layer<3;layer++){
    const cnt=10-layer*2,ls=.3+layer*.35,pw=.18+layer*.03;
    for(let i=0;i<cnt;i++){
      const a=(i/cnt)*Math.PI*2+r()*.04;
      ctx.save();ctx.rotate(a);
      ctx.beginPath();ctx.moveTo(0,0);
      ctx.quadraticCurveTo(ls*.4,-pw*.7,ls*.8,-pw*.15);
      ctx.quadraticCurveTo(ls*.95,0,ls*.8,pw*.15);
      ctx.quadraticCurveTo(ls*.4,pw*.7,0,0);
      ctx.closePath();
      ctx.fillStyle=bc;ctx.globalAlpha=.3+layer*.13;ctx.fill();
      ctx.strokeStyle='rgba(160,120,140,.2)';ctx.lineWidth=.04;ctx.stroke();
      ctx.restore();
    }
  }
  ctx.beginPath();ctx.arc(0,0,.07,0,Math.PI*2);
  ctx.fillStyle='#f0e060';ctx.globalAlpha=.8;ctx.fill();
  ctx.restore();
}

function peony(ctx,sz,r){
  ctx.save();ctx.scale(sz,sz);
  const cols=['#f0a0b8','#e888a8','#f0b8c8','#e8a0a8','#f5c0d0'];
  const bc=cols[Math.floor(r()*cols.length)];
  for(let l=0;l<5;l++){
    const ls=.12+(l/5)*.88,cnt=6+l*3,pw=.1+l*.025;
    for(let i=0;i<cnt;i++){
      const a=(i/cnt)*Math.PI*2+r()*.35;
      const pl=ls*(.5+r()*.5);
      ctx.save();ctx.rotate(a);
      ctx.beginPath();ctx.moveTo(0,0);
      ctx.quadraticCurveTo(pl*.35,-pw*.8,pl*.8,-pw*.1);
      ctx.quadraticCurveTo(pl,0,pl*.8,pw*.1);
      ctx.quadraticCurveTo(pl*.35,pw*.8,0,0);
      ctx.closePath();
      ctx.fillStyle=bc;ctx.globalAlpha=.25+l*.1;ctx.fill();
      ctx.strokeStyle='rgba(140,80,100,.15)';ctx.lineWidth=.03;ctx.stroke();
      ctx.restore();
    }
  }
  ctx.beginPath();ctx.arc(0,0,.06+r()*.02,0,Math.PI*2);
  ctx.fillStyle='#e8c860';ctx.globalAlpha=.7;ctx.fill();
  ctx.restore();
}

function daisy(ctx,sz,r){
  ctx.save();ctx.scale(sz,sz);
  const n=16+Math.floor(r()*5),pl=.85+r()*.08,pw=.18+r()*.04;
  for(let i=0;i<n;i++){
    const a=(i/n)*Math.PI*2;
    ctx.save();ctx.rotate(a);
    ctx.beginPath();ctx.moveTo(0,0);
    ctx.quadraticCurveTo(pl*.35,-pw,pl*1.05,-.02);
    ctx.quadraticCurveTo(pl*.35,pw,0,0);
    ctx.closePath();
    ctx.fillStyle='#f8f8f5';ctx.fill();
    ctx.strokeStyle='rgba(120,120,110,.2)';ctx.lineWidth=.04;ctx.stroke();
    ctx.restore();
  }
  for(let i=0;i<n;i++){
    const a=(i/n)*Math.PI*2+Math.PI/n;
    ctx.save();ctx.rotate(a);
    ctx.beginPath();ctx.moveTo(0,0);
    ctx.quadraticCurveTo(pl*.3,-pw*.7,pl*.8,-.02);
    ctx.quadraticCurveTo(pl*.3,pw*.7,0,0);
    ctx.closePath();
    ctx.fillStyle='#f0f0ea';ctx.fill();
    ctx.strokeStyle='rgba(120,120,110,.12)';ctx.lineWidth=.03;ctx.stroke();
    ctx.restore();
  }
  ctx.beginPath();ctx.arc(0,0,.15,0,Math.PI*2);
  const g=ctx.createRadialGradient(0,0,0,0,0,.15);
  g.addColorStop(0,'#f0d860');g.addColorStop(.6,'#e8c040');g.addColorStop(1,'#c8a030');
  ctx.fillStyle=g;ctx.fill();
  for(let i=0;i<10;i++){
    const a=r()*Math.PI*2,d=r()*.12;
    ctx.beginPath();ctx.arc(Math.cos(a)*d,Math.sin(a)*d,.018+r()*.008,0,Math.PI*2);
    ctx.fillStyle='rgba(200,160,60,.4)';ctx.fill();
  }
  ctx.restore();
}

const fns=[gerbera,lily,lilyValley,carnation,chrysanthemum,tulip,orchid,lotus,peony,daisy];
const names=['Gerbera','Lirio','Lirio del Valle','Clavel','Crisantemo','Tulipán','Orquídea','Loto','Peonía','Margarita'];
return{fns,names};
}
const{fns:flowerDrawFns,names:flowerNames}=createFlowerFns();

class Flower{
  constructor(x,y,type){
    this.id=nid++;this.x=x;this.y=y;this.type=type;
    this.baseSz=18+Math.random()*22;this.sz=this.baseSz;
    this.growth=0.01;this.targetGrowth=1;
    this.swPhase=Math.random()*Math.PI*2;
    this.swSpd=.3+Math.random()*.4;
    this.swAmt=.3+Math.random()*.4;
    this.seed=Math.floor(Math.random()*100000);
    this.age=0;this.glowing=false;this.glowT=0;
  }
  hit(px,py){return Math.hypot(px-this.x,py-this.y)<this.sz*this.growth*1.3}
  grow(){this.baseSz+=5;this.targetGrowth=Math.min(this.targetGrowth+.15,1.5);this.glowing=true;this.glowT=1;this.burst()}
  burst(){
    for(let i=0;i<14;i++){
      const a=Math.random()*Math.PI*2,sp=1+Math.random()*3;
      particles.push(new Particle(this.x+(Math.random()-.5)*this.sz*.4,this.y+(Math.random()-.5)*this.sz*.4,
        Math.cos(a)*sp,Math.sin(a)*sp-1,.5+Math.random()*.7,.8+Math.random()*.8,'#f0e8c0',true));
    }
  }
  update(dt){
    this.age+=dt;
    if(this.growth<this.targetGrowth){this.growth+=dt*.7;if(this.growth>this.targetGrowth)this.growth=this.targetGrowth}
    this.swPhase+=dt*this.swSpd;
    if(this.glowing){this.glowT-=dt*.5;if(this.glowT<=0){this.glowing=false;this.glowT=0}}
  }
  draw(ctx){
    const cs=this.sz*this.growth;
    const sw=Math.sin(this.swPhase)*this.swAmt*.012;
    if(this.glowing&&this.glowT>0){
      ctx.save();
      const g=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,cs*2.5);
      g.addColorStop(0,`rgba(255,245,200,${this.glowT*.3})`);
      g.addColorStop(.5,`rgba(255,235,180,${this.glowT*.1})`);
      g.addColorStop(1,'rgba(255,235,180,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(this.x,this.y,cs*2.5,0,Math.PI*2);ctx.fill();ctx.restore();
    }
    ctx.save();ctx.fillStyle='rgba(30,50,15,.06)';
    ctx.beginPath();ctx.ellipse(this.x+2,this.y+cs*.55+4,cs*.45,cs*.12,0,0,Math.PI*2);ctx.fill();ctx.restore();
    const sl=cs*1.8+8;
    ctx.save();ctx.strokeStyle='#4a8030';ctx.lineWidth=1.8;ctx.globalAlpha=.55;
    ctx.beginPath();ctx.moveTo(this.x+sw*4,this.y+cs*.15);
    ctx.bezierCurveTo(this.x+sw*5+4,this.y+sl*.4,this.x+sw*6-2,this.y+sl*.7,this.x+sw*7,this.y+sl);
    ctx.stroke();
    ctx.strokeStyle='#3a7020';ctx.lineWidth=.7;ctx.globalAlpha=.3;
    ctx.beginPath();ctx.moveTo(this.x+sw*4+1,this.y+cs*.15+1);
    ctx.bezierCurveTo(this.x+sw*5+5,this.y+sl*.4+1,this.x+sw*6-1,this.y+sl*.7+1,this.x+sw*7+1,this.y+sl+1);
    ctx.stroke();
    ctx.save();ctx.translate(this.x+sw*5+2+(this.seed%7-3),this.y+sl*.35+5+(this.seed%5-2));ctx.rotate(-.3+sw+.06*(this.seed%7-3));
    ctx.fillStyle='#4a8030';ctx.globalAlpha=.4;
    ctx.beginPath();ctx.moveTo(0,0);
    ctx.bezierCurveTo(5,-8,12,-7,8,0);ctx.bezierCurveTo(12,7,5,8,0,0);ctx.fill();ctx.restore();
    ctx.restore();
    ctx.save();ctx.translate(this.x,this.y);ctx.rotate(sw);
    if(this.type!==2){
      const col=['#ff7f50','#faf5ee','','#f096a8','#f0c840','#e05060','#d0a8d8','#f0c8d8','#f0a0b8','#f8f8f5'][this.type];
      ctx.fillStyle=col;ctx.beginPath();ctx.arc(0,0,cs*.35,0,Math.PI*2);ctx.fill();
    }
    const r=rng(this.seed);
    flowerDrawFns[this.type](ctx,cs,r);
    ctx.restore();
  }
}

class Particle{
  constructor(x,y,vx,vy,life,size,color,glow=false){
    this.x=x;this.y=y;this.vx=vx;this.vy=vy;
    this.ml=life;this.life=life;this.sz=size;this.msz=size;
    this.color=color;this.glow=glow;
  }
  update(dt){
    this.x+=this.vx*dt*60;this.y+=this.vy*dt*60;
    this.vy+=.015*dt*60;this.life-=dt;
    this.sz=this.msz*(this.life/this.ml);
    return this.life>0;
  }
  draw(ctx){
    const a=clamp(this.life/this.ml,0,1);
    if(this.glow){
      ctx.save();
      const g=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.sz*4);
      g.addColorStop(0,`rgba(255,248,215,${a*.5})`);g.addColorStop(1,'rgba(255,248,215,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(this.x,this.y,this.sz*4,0,Math.PI*2);ctx.fill();ctx.restore();
    }
    ctx.save();ctx.fillStyle=this.color;ctx.globalAlpha=a;
    ctx.beginPath();ctx.arc(this.x,this.y,this.sz,0,Math.PI*2);ctx.fill();ctx.restore();
  }
}

let flowers=[],particles=[],fireflies=[];

function initFireflies(){
  fireflies=[];
  for(let i=0;i<30;i++)fireflies.push({
    x:Math.random()*W,y:Math.random()*H,
    vx:(Math.random()-.5)*.15,vy:(Math.random()-.5)*.15,
    ph:Math.random()*Math.PI*2,sz:1.5+Math.random()*2.5,sp:.3+Math.random()*.4
  });
}

function addFlower(x,y){
  const type=Math.floor(Math.random()*flowerDrawFns.length);
  const f=new Flower(x,y,type);
  f.baseSz=15+Math.random()*18;flowers.push(f);
  for(let i=0;i<8;i++){
    const a=Math.random()*Math.PI*2,sp=.5+Math.random()*1.5;
    particles.push(new Particle(x+(Math.random()-.5)*8,y+(Math.random()-.5)*8,
      Math.cos(a)*sp,Math.sin(a)*sp-.5,.4+Math.random()*.5,.8+Math.random()*.5,'#f0e8c0',true));
  }
}

function handleInput(cx,cy){
  for(let i=flowers.length-1;i>=0;i--){if(flowers[i].hit(cx,cy)){flowers[i].grow();return}}
  const n=1+Math.floor(Math.random()*2);
  for(let i=0;i<n;i++)addFlower(cx+(Math.random()-.5)*35,cy+(Math.random()-.5)*15);
}

C.addEventListener('click',e=>handleInput(e.clientX,e.clientY));
C.addEventListener('touchstart',e=>{e.preventDefault();for(const t of e.changedTouches)handleInput(t.clientX,t.clientY)},{passive:false});

let lastT=0;
function update(dt){
  for(const f of flowers)f.update(dt);
  particles=particles.filter(p=>p.update(dt));
  for(const ff of fireflies){
    ff.ph+=dt*ff.sp;ff.x+=ff.vx+Math.sin(ff.ph*.7)*.12;ff.y+=ff.vy+Math.cos(ff.ph*.5)*.08;
    if(ff.x<-20)ff.x=W+20;if(ff.x>W+20)ff.x=-20;
    if(ff.y<-20)ff.y=H+20;if(ff.y>H+20)ff.y=-20;
  }
}

function draw(){
  X.clearRect(0,0,W,H);
  drawGardenBackground();
  drawAnimatedVines(globalTime);
  for(const f of flowers)f.draw(X);
  for(const ff of fireflies){
    const g=.5+Math.sin(ff.ph*2)*.4;
    X.save();
    const gr=X.createRadialGradient(ff.x,ff.y,0,ff.x,ff.y,ff.sz*5);
    gr.addColorStop(0,`rgba(255,250,220,${g*.4})`);gr.addColorStop(.3,`rgba(255,245,200,${g*.12})`);gr.addColorStop(1,'rgba(255,245,200,0)');
    X.fillStyle=gr;X.beginPath();X.arc(ff.x,ff.y,ff.sz*5,0,Math.PI*2);X.fill();X.restore();
    X.save();X.fillStyle=`rgba(255,250,220,${.4+g*.4})`;
    X.beginPath();X.arc(ff.x,ff.y,ff.sz*(.3+g*.7),0,Math.PI*2);X.fill();X.restore();
  }
  for(const p of particles)p.draw(X);
  drawVignette();
}

function loop(t){
  const dt=lastT?Math.min((t-lastT)/1000,.05):.016;
  lastT=t;globalTime=t/1000;
  update(dt);draw();
  requestAnimationFrame(loop);
}

function init(){
  resize();initFireflies();initVineAnim();
  requestAnimationFrame(loop);
}
init();
</script>
